name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Creates a workflow-type Pages site if the repository has none yet. It cannot convert an
      # existing "Deploy from a branch" site: that must be switched to "GitHub Actions" in
      # Settings → Pages → Build and deployment → Source.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  explain-failure:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::The Pages deployment was rejected before it started. Check two settings: (1) Settings → Environments → github-pages → 'Deployment branches and tags' must allow 'main' (add it, or choose 'No restriction'); this rule is created automatically from whichever branch first enabled Pages. (2) Settings → Pages → Build and deployment → Source must be 'GitHub Actions'. Then re-run this workflow. https://github.com/${{ github.repository }}/settings/environments and https://github.com/${{ github.repository }}/settings/pages"
          exit 1
